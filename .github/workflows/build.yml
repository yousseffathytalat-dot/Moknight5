name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find or extract Android project
        shell: bash
        run: |
          set -euo pipefail
          find_settings() {
            find . -type f -name 'settings.gradle.kts' \
              -not -path '*/.git/*' -not -path '*/.gradle/*' -not -path '*/build/*' \
              -print -quit 2>/dev/null || true
          }
          SETTINGS_FILE="$(find_settings)"
          if [[ -z "$SETTINGS_FILE" ]]; then
            while IFS= read -r -d '' archive; do
              echo "Trying project archive: $archive"
              mkdir -p "$RUNNER_TEMP/moplayer-extract"
              if unzip -oq "$archive" -d "$RUNNER_TEMP/moplayer-extract"; then
                SETTINGS_FILE="$(cd "$RUNNER_TEMP/moplayer-extract" && find . -type f -name 'settings.gradle.kts' -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit || true)"
                if [[ -n "$SETTINGS_FILE" ]]; then
                  PROJECT_DIR="$RUNNER_TEMP/moplayer-extract/$(dirname "$SETTINGS_FILE" | sed 's#^\./##')"
                  break
                fi
              fi
            done < <(find . -maxdepth 5 -type f -iname '*.zip' -not -path '*/.git/*' -print0)
          else
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          fi
          if [[ -z "${PROJECT_DIR:-}" || ! -f "$PROJECT_DIR/settings.gradle.kts" ]]; then
            echo 'ERROR: Could not find settings.gradle.kts. Upload the extracted complete project or a ZIP containing it.'
            echo 'Repository files:'
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Locate APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching under: $PROJECT_DIR"
          find "$PROJECT_DIR" -type f -iname '*.apk' -print
          APK_PATH="$(find "$PROJECT_DIR" -type f -iname '*debug*.apk' -print -quit || true)"
          if [[ -z "$APK_PATH" ]]; then
            APK_PATH="$(find "$PROJECT_DIR" -type f -name '*.apk' -print -quit || true)"
          fi
          if [[ -z "$APK_PATH" ]]; then
            echo 'ERROR: assembleDebug completed but no APK was found.'
            find "$PROJECT_DIR" -maxdepth 6 -type d -name outputs -print
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/artifacts/MoPlayer-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/artifacts/MoPlayer-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoPlayer-debug-apk
          path: artifacts/MoPlayer-debug.apk
          if-no-files-found: error
          retention-days: 7
